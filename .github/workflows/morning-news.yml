name: 朝の世界ニュース自動配信

on:
  schedule:
    # 日本時間 4:30 に実行（UTC 19:30。GitHub Actionsの時刻はUTC基準）
    - cron: "30 19 * * *"
  workflow_dispatch:
    # 手動実行もできるようにしておく（テスト用）

permissions:
  contents: write

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: ニュース取得・要約・通知を実行
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python main.py

      - name: 生成されたWebページをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet --cached || git commit -m "自動更新: 朝のニュース ($(date +'%Y-%m-%d'))"
          git push